span><span style=\"color:#F97583\"> for</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#79B8FF\">0</span><span style=\"color:#E1E4E8\">..</span><span style=\"color:#FFAB70\">bound_count</span><span style=\"color:#E1E4E8\">) </span><span style=\"color:#F97583\">|</span><span style=\"color:#FFAB70\">i</span><span style=\"color:#F97583\">|</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">                full_args</span><span style=\"color:#E1E4E8\">[</span><span style=\"color:#FFAB70\">i</span><span style=\"color:#E1E4E8\">] </span><span style=\"color:#F97583\">=</span><span style=\"color:#FFAB70\"> bound_args</span><span style=\"color:#E1E4E8\">[</span><span style=\"color:#FFAB70\">i</span><span style=\"color:#E1E4E8\">];</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            }</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            inline</span><span style=\"color:#F97583\"> for</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#79B8FF\">0</span><span style=\"color:#E1E4E8\">..</span><span style=\"color:#FFAB70\">remaining_count</span><span style=\"color:#E1E4E8\">) </span><span style=\"color:#F97583\">|</span><span style=\"color:#FFAB70\">i</span><span style=\"color:#F97583\">|</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">                full_args</span><span style=\"color:#E1E4E8\">[</span><span style=\"color:#FFAB70\">bound_count</span><span style=\"color:#F97583\"> +</span><span style=\"color:#FFAB70\"> i</span><span style=\"color:#E1E4E8\">] </span><span style=\"color:#F97583\">=</span><span style=\"color:#FFAB70\"> remaining_tuple</span><span style=\"color:#E1E4E8\">[</span><span style=\"color:#FFAB70\">i</span><span style=\"color:#E1E4E8\">];</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            }</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            return</span><span style=\"color:#79B8FF\"> @call</span><span style=\"color:#E1E4E8\">(.</span><span style=\"color:#FFAB70\">auto</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">f</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">full_args</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">        }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">    };</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    return</span><span style=\"color:#F97583\"> switch</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#FFAB70\">remaining_count</span><span style=\"color:#E1E4E8\">) {</span></span>\n<span data-line=\"\"><span style=\"color:#79B8FF\">        0</span><span style=\"color:#F97583\"> =></span><span style=\"color:#F97583\"> struct</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            fn</span><span style=\"color:#B392F0\"> call</span><span style=\"color:#E1E4E8\">() </span><span style=\"color:#FFAB70\">info</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">return_type</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#F97583\">?</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                return</span><span style=\"color:#FFAB70\"> Impl</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">callWithArgs</span><span style=\"color:#E1E4E8\">(.{});</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">        }.</span><span style=\"color:#FFAB70\">call</span><span style=\"color:#E1E4E8\">,</span></span>\n<span data-line=\"\"><span style=\"color:#79B8FF\">        1</span><span style=\"color:#F97583\"> =></span><span style=\"color:#F97583\"> struct</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            fn</span><span style=\"color:#B392F0\"> call</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">a0</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#FFAB70\">p</span><span style=\"color:#E1E4E8\">[</span><span style=\"color:#FFAB70\">bound_count</span><span style=\"color:#E1E4E8\">].</span><span style=\"color:#F97583\">type</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#F97583\">?</span><span style=\"color:#E1E4E8\">) </span><span style=\"color:#FFAB70\">info</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">return_type</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#F97583\">?</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                return</span><span style=\"color:#FFAB70\"> Impl</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">callWithArgs</span><span style=\"color:#E1E4E8\">(.{</span><span style=\"color:#FFAB70\">a0</span><span style=\"color:#E1E4E8\">});</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">        }.</span><span style=\"color:#FFAB70\">call</span><span style=\"color:#E1E4E8\">,</span></span>\n<span data-line=\"\"><span style=\"color:#6A737D\">        //...</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">    }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">}</span></span></code></pre></figure>\n<p>This likely seems like a minor deal to most people, but I am impressed that a coding agent could figure out a niche feature in a less popular language and produce working code for an uncommon task.\nZig recently pushed breaking changes to this kind of code in their recent release(0.15), and the agent was able to navigate that in context, even though such things were not in training data.</p>\n<!-- broader takeaways-->\n<!-- 1. **An experienced developer is still needed** to use these tools most effectively, pointing them in the correct direction and evaluating their decisions within a problem domain. -->\n<!-- 2. I found **agent speed and difficulty expressing the full nature of the problem to be my limiting factor** in use. Given enough time, I could often force the agent to solve most easy-medium difficulty problems. On harder problems, I usually gave up and did it myself. -->\n<!-- 3. **Acceptance criteria varies by problem domain**, and AI output code is often bloated. In some use cases like frontend, this is less of an issue, in others like performance-intensive code, each line matters. -->\n<!-- 4. **Intelligence in models matters.** The difference between Opus 4.5 and other alternatives is significant, and can minimize overall iterations needed as well as enable. Agentic IDEs have become good enough that the ball is back in the court of the model development. -->\n<!---->\n<h2 id=\"broader-observations\">Broader Observations</h2>\n<h3 id=\"vibe-waiting-and-time-management\">Vibe Waiting and Time Management</h3>\n<p>Personally, I have always favored faster non-reasoning llms for searching tasks, things like Gemini Flash, GPT 5.x Instant, Kimi K2 0905, etc.\nThis is because of the classic “code is compiling” problem, if I have to wait for long enough, I get distracted from the project and lose a lot of productivity from the flow break(checking phone, etc.).\nThese tools take this problem to the extreme, because once you set them running, they take awhile to give a result.\nThe natural thing to do is to start the tool, get distracted and do something unproductive, and only come back when the tool is done.\nI call this phenomena “Vibe Waiting”, and I think it is something to be avoided, even if you are the most bullish AI user.\nIf you are using AI as part of your workflow, I believe you must not let waiting on an LLM be a blocking task, otherwise most of the productivity gains are lost.\nThere are many useful things you can do while an agent is running in the background.\nYou could queue up other agents and hop between managing them, you could focus on a part of the codebase the AI can’t do as well, or you could do research or review other parts of the code base.\nThis aspect is why people liken coding agents to managing a team or playing an RTS game, the core idea is to keep yourself unblocked as much as possible and manage your time effectively.\nThe creator of claude code <a href=\"https://x.com/bcherny/status/2007179832300581177\">recently shared</a> that he will often have 6 coding agents running in parallel, and then turn on desktop notifications for when each of them need his feedback.\nSuch time management/multitasking I view as critically important if you want to take advantage of these agents, otherwise they will actively waste your time and teach you to turn off your brain.</p>\n<h3 id=\"connection-to-code\">Connection to Code</h3>\n<p>On the topic of turning off your brain, I view the biggest problem of AI code generation is it encourages you to rely on code you don’t read or understand.\nThere are a various detrimental effects of not being connected to the codebase that are unique in agent vs traditional coding.\nOne is that is the agent is not able to solve your problem, it is often worse to debug code that you didn’t write, and you may be gatekept from your own code by neding to ask the agent for clarification.\nThis is why I believe developers with familiarity in the subject matter, as well as simpler languages/tools, substantially improve the agentic coding experience, because of the ability for the human to read and edit the code.\nAnother issue is a level of understanding of the actual capabilities of the code created.\nPassing tests can help with this problem, but most software has various edge cases and limitations to what it can do, that may or may not have been fully encoded within the specification, or fully reported by the agent.\nYou may not know how generalizable or special cased some pieces of software are, let alone anything about performance characteristics, flexibility to change pieces, etc.\nAs you try to judge the decisions the agents make going forward(such as discussions in planning mode), and direct them to solve unsolved problems, your innate understanding of what those are, of what can or could go wrong, is imperative in shaping how the project is designed.\nIn this stage where these agents still rely on human direction, poor technical understanding of how your system works will lead to poor decisions about how to change it going forward.\nIt’s the same reason we value leadership with technical understanding in the software field, not just a business background.</p>\n<h3 id=\"when-is-ai-good-enough\">When is AI Good Enough?</h3>\n<p>I think the efficacy of AI code is deeply tied to acceptance standards in the particular domain.\nThis is partially due to models being trained on some tasks more than others, but it’s also how easy a verification loop can be made, and how tight are efficiency concerns.\nWithin these experiments, in frontend I had very low acceptance standards, if the page renders and it looks good enough, I don’t care how it occurred.\nWhen I am writing a pathing engine, I very much do care about efficiency and simplicity in the code, so the model is not as helpful.\nIn my QR code case, there was no scaffolding for an incremental verification loop, so the model had to make big jumps without checking its work, and was not able to efficiently make progress.\nThese differences explain why some people think that software engineering has been solved by AI, and some people think that it’s absolutely useless.\nThe reality is somewhere in between, and both may be right.</p>\n<h2 id=\"going-forward\">Going Forward</h2>\n<p>After this exploration, I primarily intend to use coding agents when I want to make frontend changes or do boilerplate heavy activities that involve more googling than writing code.\nFor any more complex task, I prefer to write the code and do the setup myself.\nMy current headspace treats AI as a customizable blackbox dependency generator of sorts.\nIf I am not willing to import a package I wouldn’t read, I am not willing to use AI code to solve the problem.\nExceptions to this are when the changes are of small enough magnitude I can read them, in a clear enough language that I am not concerned about hidden behavior.</p>\n<p>I have turned off AI autocomplete for most languages, I find that in the domains where it is useful, I can allow full fledged agentic coding, and if it’s not, then it’s usually distracting.\nI am not certain I’ll keep it this way, perhaps I will turn it on again if I work in more boilerplate heavy environments.</p>\n<p>In order for me to integrate agentic coding into more of my workflows, a core improvement would need to be speed.\nBecause the edits take so long, agents require various amounts of babysitting to be effective, which breaks my workflow and encourages me to get distracted and not give it close scrutiny.\nThese speed changes tie hand in hand with testing, as errors can be caught earlier via rapid iteration and validation of how well the current solution fits the problem.\nThis is how I prefer to use LLMs for search, faster models that give a quick response which I can then steer to the answers I am looking for, rather than trying to put in some prompt/context engineering work ahead of time, and not know whether it would pay off.\nA much more intelligent model that could confidently one-shot any problem and resolve all edge cases would also resolve this concern, but I only see that possible in closed environments with many tests.</p>\n<p>I think my use will change in the future, and I am impressed by how much these tools have improved in the last 6 months.\nMy message to foundational model companies is to focus on model speed and consistency over intelligence going forward, this is what I am looking for to be able to more confidently use agents to speed up my development process.\nFailing early would also be a useful feature.\nI discovered the limitations of the models after running them for a certain amount of time, and it would be preferable if the model could gauge it’s own ability in some form, before users need to spend high amounts of inference to not solve the problem.</p>\n<p>One problem I think will remain difficult long term is the ability for human’s to express the details of their problem to the LLM.\nThere is a lot that a person might have in their mind that is difficult to rapidly communicate with natural languague, and to define it it often most of the work for a person to solve it themselves.\nThis was a recurring difficulty in most of my projects, particularly the game development.</p>","metadata":{"headings":[{"depth":1,"slug":"experiments-with-ai-coding","text":"Experiments with AI Coding"},{"depth":2,"slug":"overall-takeaways","text":"Overall Takeaways"},{"depth":2,"slug":"tools-used","text":"Tools Used"},{"depth":3,"slug":"supermavenautocomplete","text":"SuperMaven(Autocomplete)"},{"depth":3,"slug":"opencodeagentic","text":"OpenCode(Agentic)"},{"depth":3,"slug":"models","text":"Models"},{"depth":2,"slug":"tasks-attempted","text":"Tasks Attempted"},{"depth":3,"slug":"personal-site","text":"Personal Site"},{"depth":3,"slug":"ml-deployment-to-webassembly","text":"ML Deployment to WebAssembly"},{"depth":3,"slug":"bespoke-qr-code-generator","text":"Bespoke QR Code Generator"},{"depth":3,"slug":"game-development","text":"Game Development"},{"depth":3,"slug":"compile-time-metaprogamming","text":"Compile-time Metaprogamming"},{"depth":2,"slug":"broader-observations","text":"Broader Observations"},{"depth":3,"slug":"vibe-waiting-and-time-management","text":"Vibe Waiting and Time Management"},{"depth":3,"slug":"connection-to-code","text":"Connection to Code"},{"depth":3,"slug":"when-is-ai-good-enough","text":"When is AI Good Enough?"},{"depth":2,"slug":"going-forward","text":"Going Forward"}],"localImagePaths":[],"remoteImagePaths":[],"frontmatter":{"title":"AI Coding","pubDate":"2026-01-05T00:00:00.000Z","description":"Experiments in AI Coding","author":"Ibrahim Musaddequr Rahman","tags":["ai"]},"imagePaths":[]}},"collection":"blog","slug":"ai-coding"},{"id":"better-software.md","data":{"title":"Better Software, Faster","pubDate":"2025-12-22T00:00:00.000Z","description":"My goals for all software I write.","author":"Ibrahim Musaddequr Rahman","tags":["meta"]},"body":"<!--I once had something more profound for this, but I don't recall anymore-->\n<!-- and some point, should have some piece about tools-->\n# Better Software, Faster\n\nI've created a [personal site](/blog/why) to showcase and document my projects. As I do so, these are some guiding principles for how I write software going forward. \n\n## Properties of Software\n\n### Simplicity and Organization\n\nLess code is better, but not at the expense of clarity. Brevity matters, but simplicity comes first. When a cleaner solution exists, use it.\n\nCode should be descriptive and organized across reasonably-sized, well-named files. Avoid both excessive fragmentation and monolithic files. If forced to choose, prefer the latter. Both practices proactively reduce technical debt as projects scale.\n\n### Performance\n\nModern compilers and hardware are extraordinarily capable. Noticeable lag demands justification.\n\nFor most websites and CLI tools, content should load instantly. Performance isn't about specific language choices; it's about refusing to accept unnecessary slowness. Computational heavy lifting (machine learning, graphics rendering) earns a pass, but everything else should be as responsive as possible.\n\n### Portability\n\nCross-platform software is ideal. The web is the most universal platform, but supporting multiple operating systems suffices. This starts with choosing cross-platform toolchains from day one. On this site, I will deploy tools targeting WebAssembly or JavaScript.\n\nNon-cross-platform software needs clear toolchain justification. I don't do mobile or native development, so these restrictions rarely concern me.\n\n### AI Usage\n\nAI assistance should be invisible. When used, output must meet human quality standards—this applies to writing and code equally.\n\nAI accelerates work; it doesn't excuse laziness. The standard should be **AI-generated, human-verified** for any tool in this space.\n\n## Properties of Development\n\n### Rapid Initial Prototyping\n\nComplex projects need achievable checkpoints. Reaching the first checkpoint quickly is critical—it prevents wasted effort and surfaces hard problems early.\n\n### Incremental Debugging\n\nWhen progress stalls, decompose the blocker into manageable pieces. AI helps break through obstacles with fresh perspective. Projects demanding intense mental engagement are vulnerable to motivation loss and abandonment-consistent, incremental progress is the antidote.","filePath":"src/content/blog/better-software.md","digest":"3105e9c79369d130","rendered":{"html":"<!--I once had something more profound for this, but I don't recall anymore-->\n<!-- and some point, should have some piece about tools-->\n<h1 id=\"better-software-faster\">Better Software, Faster</h1>\n<p>I’ve created a <a href=\"/blog/why\">personal site</a> to showcase and document my projects. As I do so, these are some guiding principles for how I write software going forward.</p>\n<h2 id=\"properties-of-software\">Properties of Software</h2>\n<h3 id=\"simplicity-and-organization\">Simplicity and Organization</h3>\n<p>Less code is better, but not at the expense of clarity. Brevity matters, but simplicity comes first. When a cleaner solution exists, use it.</p>\n<p>Code should be descriptive and organized across reasonably-sized, well-named files. Avoid both excessive fragmentation and monolithic files. If forced to choose, prefer the latter. Both practices proactively reduce technical debt as projects scale.</p>\n<h3 id=\"performance\">Performance</h3>\n<p>Modern compilers and hardware are extraordinarily capable. Noticeable lag demands justification.</p>\n<p>For most websites and CLI tools, content should load instantly. Performance isn’t about specific language choices; it’s about refusing to accept unnecessary slowness. Computational heavy lifting (machine learning, graphics rendering) earns a pass, but everything else should be as responsive as possible.</p>\n<h3 id=\"portability\">Portability</h3>\n<p>Cross-platform software is ideal. The web is the most universal platform, but supporting multiple operating systems suffices. This starts with choosing cross-platform toolchains from day one. On this site, I will deploy tools targeting WebAssembly or JavaScript.</p>\n<p>Non-cross-platform software needs clear toolchain justification. I don’t do mobile or native development, so these restrictions rarely concern me.</p>\n<h3 id=\"ai-usage\">AI Usage</h3>\n<p>AI assistance should be invisible. When used, output must meet human quality standards—this applies to writing and code equally.</p>\n<p>AI accelerates work; it doesn’t excuse laziness. The standard should be <strong>AI-generated, human-verified</strong> for any tool in this space.</p>\n<h2 id=\"properties-of-development\">Properties of Development</h2>\n<h3 id=\"rapid-initial-prototyping\">Rapid Initial Prototyping</h3>\n<p>Complex projects need achievable checkpoints. Reaching the first checkpoint quickly is critical—it prevents wasted effort and surfaces hard problems early.</p>\n<h3 id=\"incremental-debugging\">Incremental Debugging</h3>\n<p>When progress stalls, decompose the blocker into manageable pieces. AI helps break through obstacles with fresh perspective. Projects demanding intense mental engagement are vulnerable to motivation loss and abandonment-consistent, incremental progress is the antidote.</p>","metadata":{"headings":[{"depth":1,"slug":"better-software-faster","text":"Better Software, Faster"},{"depth":2,"slug":"properties-of-software","text":"Properties of Software"},{"depth":3,"slug":"simplicity-and-organization","text":"Simplicity and Organization"},{"depth":3,"slug":"performance","text":"Performance"},{"depth":3,"slug":"portability","text":"Portability"},{"depth":3,"slug":"ai-usage","text":"AI Usage"},{"depth":2,"slug":"properties-of-development","text":"Properties of Development"},{"depth":3,"slug":"rapid-initial-prototyping","text":"Rapid Initial Prototyping"},{"depth":3,"slug":"incremental-debugging","text":"Incremental Debugging"}],"localImagePaths":[],"remoteImagePaths":[],"frontmatter":{"title":"Better Software, Faster","pubDate":"2025-12-22T00:00:00.000Z","description":"My goals for all software I write.","author":"Ibrahim Musaddequr Rahman","tags":["meta"]},"imagePaths":[]}},"collection":"blog","slug":"better-software"},{"id":"why.md","data":{"title":"My Personal Site","pubDate":"2025-12-20T00:00:00.000Z","description":"Explaning why I made this site.","author":"Ibrahim Musaddequr Rahman","tags":["meta"]},"body":"# My Site\n\n\nThis is my third iteration of a personal site, after abandoning the last attempt two years ago. I'm not passionate about front-end development. I much prefer writing machine learning, systems, and compiler code.\n\nSo why bring it back now?\n\n## Other Sites\n\nMany platforms already host the information that typically ends up on a personal site.\n\n**GitHub** is perfect for showcasing side projects, providing the exact code and instructions for users to clone and run it. However, it's not ideal for explanations or live demos.\n\n**LinkedIn** contains my full work history and education, but the platform's focus on \"professional\" social interactions leaves little room for technical, personal, or authentic content.\n\n**Medium/Substack** make it easy to write blog posts with built-in formatting, discoverability, and monetization tools. However, they lack customizability for complex interactive features.\n\n## Unique Value of a Personal Site\n\n\nHosting my own site provides a centralized place for information that other platforms don't capture well. Since I already have LinkedIn and GitHub accounts, information that belongs there will stay there. This site isn't a recruiting portfolio, it's a useful collection of resources and project explanations.\n\n### Blog\n\nPosts here will vary. Some will be high-level philosophy pieces like this one, others deeply technical. I'm inspired by interactive art experiences and want to use my site's flexibility to create them. I already have basic tools like syntax highlighting:\n\n### Demos and Tools\n\nThis site will host tools I create. I already have a rudimentary QR code generator, and plan to deploy more projects as they become useful. I'm excited to experiment with WebAssembly to make my native code projects more easily deployable online.","filePath":"src/content/blog/why.md","digest":"5994f2573b69d2a6","rendered":{"html":"<h1 id=\"my-site\">My Site</h1>\n<p>This is my third iteration of a personal site, after abandoning the last attempt two years ago. I’m not passionate about front-end development. I much prefer writing machine learning, systems, and compiler code.</p>\n<p>So why bring it back now?</p>\n<h2 id=\"other-sites\">Other Sites</h2>\n<p>Many platforms already host the information that typically ends up on a personal site.</p>\n<p><strong>GitHub</strong> is perfect for showcasing side projects, providing the exact code and instructions for users to clone and run it. However, it’s not ideal for explanations or live demos.</p>\n<p><strong>LinkedIn</strong> contains my full work history and education, but the platform’s focus on “professional” social interactions leaves little room for technical, personal, or authentic content.</p>\n<p><strong>Medium/Substack</strong> make it easy to write blog posts with built-in formatting, discoverability, and monetization tools. However, they lack customizability for complex interactive features.</p>\n<h2 id=\"unique-value-of-a-personal-site\">Unique Value of a Personal Site</h2>\n<p>Hosting my own site provides a centralized place for information that other platforms don’t capture well. Since I already have LinkedIn and GitHub accounts, information that belongs there will stay there. This site isn’t a recruiting portfolio, it’s a useful collection of resources and project explanations.</p>\n<h3 id=\"blog\">Blog</h3>\n<p>Posts here will vary. Some will be high-level philosophy pieces like this one, others deeply technical. I’m inspired by interactive art experiences and want to use my site’s flexibility to create them. I already have basic tools like syntax highlighting:</p>\n<h3 id=\"demos-and-tools\">Demos and Tools</h3>\n<p>This site will host tools I create. I already have a rudimentary QR code generator, and plan to deploy more projects as they become useful. I’m excited to experiment with WebAssembly to make my native code projects more easily deployable online.</p>","metadata":{"headings":[{"depth":1,"slug":"my-site","text":"My Site"},{"depth":2,"slug":"other-sites","text":"Other Sites"},{"depth":2,"slug":"unique-value-of-a-personal-site","text":"Unique Value of a Personal Site"},{"depth":3,"slug":"blog","text":"Blog"},{"depth":3,"slug":"demos-and-tools","text":"Demos and Tools"}],"localImagePaths":[],"remoteImagePaths":[],"frontmatter":{"title":"My Personal Site","pubDate":"2025-12-20T00:00:00.000Z","description":"Explaning why I made this site.","author":"Ibrahim Musaddequr Rahman","tags":["meta"]},"imagePaths":[]}},"collection":"blog","slug":"why"}];
