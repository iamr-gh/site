</button> </div> </div> </div> <!-- Blog Posts List --> <div class="space-y-0" id="posts-list"> <div class="post-item" data-title="AI Coding" data-description="Experiments in AI Coding" data-tags="ai"> <div class="post-line py-3 border-b border-border last:border-b-0"> <a href="/blog/ai-coding" class="block group"> <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-4"> <h3 class="text-base sm:text-lg font-medium group-hover:underline underline-offset-4 decoration-primary transition-all line-clamp-2"> AI Coding </h3> <div class="flex flex-wrap items-center gap-2 sm:gap-4"> <span class="inline-flex items-center px-2 py-1 bg-secondary text-secondary-foreground rounded-lg text-xs font-medium whitespace-nowrap"> ai </span> <p class="text-xs sm:text-sm text-muted-foreground whitespace-nowrap"> Jan 4, 2026 </p> </div> </div> </a> </div> </div><div class="post-item" data-title="Better Software, Faster" data-description="My goals for all software I write." data-tags="meta"> <div class="post-line py-3 border-b border-border last:border-b-0"> <a href="/blog/better-software" class="block group"> <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-4"> <h3 class="text-base sm:text-lg font-medium group-hover:underline underline-offset-4 decoration-primary transition-all line-clamp-2"> Better Software, Faster </h3> <div class="flex flex-wrap items-center gap-2 sm:gap-4"> <span class="inline-flex items-center px-2 py-1 bg-secondary text-secondary-foreground rounded-lg text-xs font-medium whitespace-nowrap"> meta </span> <p class="text-xs sm:text-sm text-muted-foreground whitespace-nowrap"> Dec 21, 2025 </p> </div> </div> </a> </div> </div><div class="post-item" data-title="My Personal Site" data-description="Explaning why I made this site." data-tags="meta"> <div class="post-line py-3 border-b border-border last:border-b-0"> <a href="/blog/why" class="block group"> <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 sm:gap-4"> <h3 class="text-base sm:text-lg font-medium group-hover:underline underline-offset-4 decoration-primary transition-all line-clamp-2"> My Personal Site </h3> <div class="flex flex-wrap items-center gap-2 sm:gap-4"> <span class="inline-flex items-center px-2 py-1 bg-secondary text-secondary-foreground rounded-lg text-xs font-medium whitespace-nowrap"> meta </span> <p class="text-xs sm:text-sm text-muted-foreground whitespace-nowrap"> Dec 19, 2025 </p> </div> </div> </a> </div> </div> </div> <!-- No Results Message --> <div id="no-results" class="hidden text-center py-12"> <p class="text-muted-foreground text-lg">No blog posts found matching your search or filters.</p> </div> </main>  </body></html> <script>(function(){const sortedPosts = [{"id":"ai-coding.md","data":{"title":"AI Coding","pubDate":"2026-01-05T00:00:00.000Z","description":"Experiments in AI Coding","author":"Ibrahim Musaddequr Rahman","tags":["ai"]},"body":"# Experiments with AI Coding\n\nAI coding has become substantially better in the last 6 months. I don't currently use AI coding much in my workflows, beyond auto complete. \nI am starting a job to build [RL environments to improve coding agents](https://www.ycombinator.com/companies/idler), and I wish to get a better understanding of current abilities and limitations of the current technology.\n\nIn this blog post, I evaluate how useful these tools are at solving my problems by trying to unblock various stale side projects. This is not with respect to any benchmark other than my personal real life usage.\n\nAll observations are as of early January 2026.\n\n## Overall Takeaways\n\nIf you don't want to read a long post, here are my quick takeaways:\n1. **An experienced developer is still needed** to use these tools most effectively, pointing them in the correct direction and evaluating their decisions within a problem domain.\n2. I found **agent speed and difficulty expressing the full nature of the problem to be my limiting factor** in use. Given enough time, I could often force the agent to solve most easy-medium difficulty problems, especially when a verification loop is accessible to the agent. On harder problems, I usually gave up and did it myself.\n3. **Acceptance criteria varies by problem domain**, and AI output code is often bloated. In some use cases like frontend, this is less of an issue, in others like performance-intensive code, each line matters.\n4. **Intelligence in models matters.** The difference between Opus 4.5 and other alternatives is significant, and can minimize overall iterations needed as well as enable. Agentic IDEs have become good enough that the ball is back in the court of the model development.\n\n<!-- need to work on this-->\n## Tools Used\nPersonally, I primarily use neovim+tmux as my editor setup, preferring to be closer to the terminal. A lot of the popular tools(e.g. Cursor) are based on VSCode-style workflows, which often feel inelegant to me. This does not stop me from using these tools, but I don't find them as useful because I feel an inherent slowdown that contrasts whatever ai benefits I get.\n\nAs such, I am actively looking for terminal-native ai-coding tools and ways to integrate into my existing neovim workflows.\n\n### SuperMaven(Autocomplete)\n\nSupermaven is the autocomplete engine used(and acquired) by Cursor. However, you can still use it in other editors, with a generous free tier. \nIt is the only AI-autocomplete I have tried that is as fast as an LSP, and what I use in neovim.\n\n### OpenCode(Agentic)\n\n[OpenCode](https://opencode.ai/) is a cli tool similar to Claude Code, but designed for support of any models on openrouter, and created by neovim users.\nLike many of such tools, it consists of distinct \"Plan\" and \"Build\" agents, where you discuss with an agent that looks at the code base, and only once you are satisfied with the plan, you enable the agent to edit code and build it.\nI found this workflow to be an improvement over methods, allowing agents to take full advantage of reasoning abilities. \nHotkeys and UI were relatively nice, I mostly used OpenCode outside of neovim in a separate tmux tab, and then I would run and read the code afterwards to validate the results.\n\nI found OpenCode to be relatively good at providing the models the tools to access the internet and my codebase, with reasonable permissions.\nMost of the limitations described seem to be limitations of the models themselves, and as such, I did not try any other agentic tools within this testing.\n\n### Models\n\nAnthropic's Opus 4.5 is considered to be the gold standard in agentic coding, while being the significantly more expensive. I attempted to use cheaper alternatives when possible, but when they could not solve the problem, I used Opus 4.5.\n\nOpenCode has their own fine tuned model(similar to Cursor's Composer) that was available for free, I used this in initial testing and it performed reasonably well for simple tasks.\n\n[GLM 4.7](https://z.ai/blog/glm-4.7) was newly released during this project, and I switched to it over OpenCode's model. This model seemed to be good at understanding what was happening in the codebase, and is quite good at frontend given the relative cost of the model.\n\n## Tasks Attempted\n\n <!-- end up linking more of these-->\n### Personal Site\nI have been meaning to update my personal site for awhile, making the styling cleaner and providing a respectable starting to point to write blog posts and showcase projects. \nI built out a static site using astro, and told the agent to use the reference materials of shadcn as a starting point.\nI found GLM 4.7 and OpenCode's model to be more than sufficient for this task, allowing me to quickly build out much of the boilerplate that would've taken be hours to fiddle with by hand. \nIn particular, higher level edits like theming were convenient to do via natural language.\nMore complex tasks like animations required more rounds of going back and forth with the agent about the particular behavior that was broken.\n\nI found that in terms of speed, these models took about the same time to modify the codebase, regardless of the desired edit was large or small.\nThis was often due to a large amount of time being taken to read through the html and find the particular best point to modify.\nFor smaller changes, it was often much faster for me to make changes manually.\nBecause astro is a minimal web framework, it was very easy for me to validate and manually edit the HTML/CSS generated by the LLMs.\nThis codebase worked mostly in separate files, so it was easy to queue up multiple agents in parallel to work on different tasks, and then ping pong between feedback.\n\nI don't particularly enjoy writing frontend, particularly styling, so I was appreciative that I could focus on the thinking tasks like writing blog posts while the agents fixed styling in the background.\n\nYou are currently looking at the result of such efforts [iamr.site](iamr.site). \nIt is not perfect or flashy, but it is sufficient for [my use](./why.md).\n\n### ML Deployment to WebAssembly\n\nSeeing success in web development, I decided to try a harder task with more boilerplate.\n\nFor some [other research](https://github.com/iamr-gh/ejsay-gptability/blob/main/paper.pdf), I trained a small transformer model in PyTorch to classify assignments as more or less \"GPT-able\", to try to help educators better test students.\nI wanted to deploy this in a way that it could run locally in the browser via WebAssembly.\nWebAssembly toolchains are often a pain to work with, combining code in multiple languages that has to be shipped to the browser in a very particular way.\nThis task is still not intellectually complex, but requires a lot of googling and fiddling with the environment to get everything to build properly.\nThe final approach used involved compiling to the model to the ONNX format and quantizing it, and then loading that model into an ONNX web runtime and Transformers.js.\n\nThese complexities proved too much for the weaker models to handle, OpenCode's model generated large amounts of files that produced a pretty frontend in the browser, but failed to load the actual model and produce outputs.\n\nThe intelligence boost of Opus 4.5 was able to complete the problem, and it's solution was much simpler than the previous AI attempts. It identified subtleties the other models did not notice, such as that the model used a pretrained embedding, which could be loaded in from a separate optimized source for more efficiency. \nBecause I had a paper written on the project, the model was able to efficiently understand that context of what this model was doing, and able to pull examples and language from the paper, producing a quality interactive tool.\nLike the weaker models, this page did not work on first attempt. \nHowever, after pasting console error messages back to the agent a couple times, it was able to solve the problem where weaker models get stuck in a loop.\n\nThis process was not cheap. Even in an environment with minimal files and well formed context, this generation cost ~$8 of inference. Given my unfamiliarity, this probably would've taken me a couple hours of work, so a reasonable amount of time was saved. I suspect someone familiar with the space could get it done in under half an hour.\n\nThe code produced in this process was well documented, the commit can be viewed [here](https://github.com/iamr-gh/essay-gptability/tree/web_demo_opus/web_demo).\nThe results of this effort can be viewed at [iamr.site/gptability](iamr.site/gptability).\n\n<figure>\n  <img src=\"/images/blog/ai-coding/gptability.png\" alt=\"GPTability deployment showing the interactive classifier tool\">\n  <figcaption>Interactive transformer model deployment running in browser via WebAssembly</figcaption>\n</figure>\n\n### Bespoke QR Code Generator\nI decided to now test the ability to transfer code over from another code base, as well as work in a less common language.\nI previously wrote a (qr code generator from scratch)[https://github.com/iamr-gh/qr] in the programming language nim, which compiles to both assembly(through LLVM) and javascript for web deployments.\n\nThe first task for the coding agent was to take the existing webpage and integrate it into my current site, standardizing the styling and linking some navigation.\nThis task wasn't particularly difficult, the result is deployed at (iamr.site/qr)[iamr.site/qr].\n\n<figure class=\"image-smaller\">\n  <img src=\"/images/blog/ai-coding/qr.png\" alt=\"QR code generator showing the custom styling\">\n  <figcaption>Custom QR code generator built with Nim, integrated into the site</figcaption>\n</figure>\n\nThe much harder task I gave Opus 4.5 was the extend the existing nim code. \nI implemented the most basic version of the qr code specification, which only supports URLs of 17 characters.\nThe higher versions of the specification are more complicated, combining extensions to the error correcting algorithm as well as spatial reasoning about different formats.\nThis task was admittedly quite difficult, but I was curious if such knowledge was within its training data or if it could look up existing implementations and translate them to another language.\n\n<!-- image of v1 vs v2 qr codes?-->\n\nOpus 4.5 was able to end up with nim code that compiled correctly and output a qr code of the correct size that looked reminiscent of the extended specification. However, these qr codes do not pass the test of an external reader. \nAfter prompting the model that it's code did not work, it introspected further, but without a checker integrated into the loop, it was unable to make progress on the problem. \nThis process cost $13.29 to generate no useful results, and I cut it off at this point. \nFor those curious about the attempt, the changes can be found [here](https://github.com/iamr-gh/qr/commit/d1a873bdd7e2a917010d7a4be50833e2c0e154cc).\n\n\n### Game Development\nWith some knowledge of easy and hard tasks for coding agents, I wished to experiment with more medium difficulty tasks to find the exact lines of competence.\nGame development is a space with a lot of space for code to be written, with a rich environment of varying levels of complexity and boiler plate.\n\nI revisited a project where I was writing a small pathing engine for an RTS game using zig and raylib. \nIn my particular interest, this problem boils down to creating responsive multi agent pathing and control in a 2 or 2.5 dimensional environment.\nI'll write up a future blog post about the goals and challenges of this project, but think of this as within the algorithms and performance domain.\n\n<!--boilerplate and default algorithms-->\n\nThis project was in early stages when I started consisting of just a rendered grid and mouse selection.\nGLM 4.7 was able to bring this up to interactive single agent pathing in an environment with obstacles.\nThis was within the realm of common boilerplate, but still impressive that it output an implementation of A* within zig.\n\n<!-- insert a gif of initial single agent pathing-->\n\nThe next step of this was where the complexity of the project lies, implementing multiagent pathing while trying to minimize collisions.\nThis involves modifying existing algorithms, creating a unique planner for this particular circumstance.\nI again upgraded to Opus 4.5 for this task, and came across a difficulty not previously encountered: explaining the problem and my priorities. \nOpus did spit out a solution that began to address the problem, but it added layers and complexity and solved additional problems in ways not asked for.\nFor this example I'll explain some specific code, particularly the diffs between [Opus's implementation](https://github.com/iamr-gh/rts-engine/compare/1d430cf0b9a6665170709a4ebaacb8df19b0e012...e866330d0e04f09e80068117daf5af8f5b7e87ef)\nand [my own implementation](https://github.com/iamr-gh/rts-engine/compare/1d430cf0b9a6665170709a4ebaacb8df19b0e012...a1c8a0a94688ccb07dbeac3dfdaec8c45db65077)\nafterwards.\n\nThe specifics of this task was to 1) allow the selection of multiple agents and then 2) pick a set of goals for them based around the clicked point.\nBecause the paths needed to not collide, more than one location needed to be picked around the goal.\nAt this point, the task was only to pick the goals, not to force the pathing algorithm to avoid overlapping individual agent paths.\nI went back and forth with the agent for some time in planning to explain this situation, as well as emphasize symplicity as a virtue when picking between multiple approaches.\nTo me, the solution to this problem would be a simple BFS around the target point, and then assigning agents arbitrarily to the points.\n\n```zig\n// my solution\npub fn getGroupGoals(obstacles: *ObstacleGrid, goal: ScreenPos, ...) !std.ArrayList(ScreenPos) {\n    var goals = std.ArrayList(ScreenPos).empty;\n    var taken = std.AutoHashMap(ScreenPos, void).init(allocator);\n\n    var toVisit = queue.Queue(ScreenPos).init(allocator);\n    defer toVisit.deinit();\n\n    try toVisit.enqueue(goal);\n    try taken.put(goal, {});\n\n    // bfs\n    while (goals.items.len < count) {\n        const curr = toVisit.dequeue().?;\n        if (obstacles.obstacles.get(map.screenToGridCoord(curr, gridSize))) |height| {\n            if (height >= 3) {\n                continue;\n            }\n        }\n        try goals.append(allocator, curr);\n        for (crossDiagonalMovement) |move| {\n            const movedPoint: ScreenPos = .{ .x = curr.x + move[0] * gridSize, .y = curr.y + move[1] * gridSize };\n            if (taken.get(movedPoint)) |_| {} else {\n                try taken.put(movedPoint, {});\n                try toVisit.enqueue(movedPoint);\n            }\n        }\n    }\n    return goals;\n}\n```\n\nOpus 4.5 implemented a much more complex algorithm, using a modified BFS with a range, calculating a centroid of the agents, and then placing them within a target region based on their offset from the centroid.\nThis algorithm does solve other problems not asked, however it is also 4-5x longer than my intended solution, and introduces far more edge cases and interactions.\nI've added an (abridged) version of the code below just to convey how much more additional complexity this adds. \nThere are also small bugs that went unannotated in the code, such as claiming the traversal was a BFS while using a datastructure that would yield a DFS.\n\n```zig\n// agent solution(some parts omitted)\nfn gatherAvailableCells(\n    targetPos: ScreenPos,\n    count: usize,\n    gridSize: i32,\n    obstacleGrid: *const ObstacleGrid,\n    maxSearchRadius: i32,\n    allocator: std.mem.Allocator,\n) !std.ArrayList(ScreenPos) {\n    var result = std.ArrayList(ScreenPos).empty;\n    errdefer result.deinit(allocator);\n\n    // NOT ACTUALLY A QUEUE(-> DFS)\n    var queue = std.ArrayList(ScreenPos).empty;\n    defer queue.deinit(allocator);\n\n    // <same bfs logic>\n}\n\npub fn findGroupGoals(\n    targetPos: ScreenPos,\n    agents: []const Agent,\n    gridSize: i32,\n    obstacleGrid: *const ObstacleGrid,\n    allocator: std.mem.Allocator,\n    maxSearchRadius: i32,\n) !std.ArrayList(ScreenPos) {\n    var result = std.ArrayList(ScreenPos).empty;\n    errdefer result.deinit(allocator);\n    // Count selected agents and calculate centroid\n    var selectedCount: usize = 0;\n    var centroidX: i64 = 0;\n    var centroidY: i64 = 0;\n    for (agents) |agent| {\n        if (agent.selected) {\n            selectedCount += 1;\n            centroidX += agent.pos.x;\n            centroidY += agent.pos.y;\n        }\n    }\n    if (selectedCount == 0) {\n        return result;\n    }\n    centroidX = @divFloor(centroidX, @as(i64, @intCast(selectedCount)));\n    centroidY = @divFloor(centroidY, @as(i64, @intCast(selectedCount)));\n    // Snap target to grid center\n    const targetSquare = grid.getSquareInGrid(gridSize, targetPos);\n    const targetCenter = grid.getSquareCenter(gridSize, targetSquare);\n    // Gather available cells near target (more than needed for flexibility)\n    var availableCells = try gatherAvailableCells(\n        targetCenter,\n        selectedCount * 4,\n        gridSize,\n        obstacleGrid,\n        maxSearchRadius,\n        allocator,\n    );\n    defer availableCells.deinit(allocator);\n    // Track which cells have been assigned\n    var assignedCells = std.AutoHashMap(ScreenPos, void).init(allocator);\n    defer assignedCells.deinit();\n    // For each selected agent, find the best matching cell\n    for (agents) |agent| {\n        if (!agent.selected) continue;\n        // Compute agent's direction from centroid\n        const agentDx = agent.pos.x - @as(i32, @intCast(centroidX));\n        const agentDy = agent.pos.y - @as(i32, @intCast(centroidY));\n        // Check if agent is at centroid (or very close)\n        const atCentroid = (@abs(agentDx) < gridSize and @abs(agentDy) < gridSize);\n        const agentAngle = computeAngle(agentDx, agentDy);\n        // Find best matching cell\n        var bestCell: ?ScreenPos = null;\n        var bestScore: f32 = std.math.inf(f32);\n        for (availableCells.items) |cell| {\n            if (assignedCells.contains(cell)) continue;\n            // Compute cell's direction from target\n            const cellDx = cell.x - targetCenter.x;\n            const cellDy = cell.y - targetCenter.y;\n            const cellAtTarget = (cellDx == 0 and cellDy == 0);\n            // Score = angular difference + small distance penalty for tie-breaking\n            var score: f32 = 0;\n            if (atCentroid) {\n                // Agent at centroid prefers cells closest to target\n                const dist = @as(f32, @floatFromInt(@abs(cellDx) + @abs(cellDy)));\n                score = dist;\n            } else if (cellAtTarget) {\n                // Target cell has no angle - give it a moderate score\n                // (center-most agents will claim it due to their low scores)\n                score = std.math.pi;\n            } else {\n                const cellAngle = computeAngle(cellDx, cellDy);\n                const angularDiff = angleDifference(agentAngle, cellAngle);\n                // Distance from target as tie-breaker (normalized)\n                const dist = @as(f32, @floatFromInt(@abs(cellDx) + @abs(cellDy)));\n                const distPenalty = dist / @as(f32, @floatFromInt(gridSize * 100));\n                score = angularDiff + distPenalty;\n            }\n            if (score < bestScore) {\n                bestScore = score;\n                bestCell = cell;\n            }\n        }\n        // Assign cell (or fallback to agent's current position)\n        if (bestCell) |cell| {\n            try assignedCells.put(cell, {});\n            try result.append(allocator, cell);\n        } else {\n            // Fallback: use agent's current position\n            const agentSquare = grid.getSquareInGrid(gridSize, agent.pos);\n            const agentCenter = grid.getSquareCenter(gridSize, agentSquare);\n            try result.append(allocator, agentCenter);\n        }\n    }\n    return result;\n}\n```\n<!-- maybe add a comparison here-->\n\nI think this example highlights the exact challenges of using AI code within this domain.\nThe solution does work, and if you didn't look at the code, you might consider it sufficient.\nHowever, this is the simplest piece of what is going to be a multipart pipeline of pathing, and it has added a large amount of complexity and unknown edge cases, while also being foreign for me to read.\n\nThe next change needed was to modify the A* algorithm to prevent the paths generated from colliding with each other, now that each agent was going to separate locations.\nMy solution involved a \\~30 line modification to compute each agent's path sequentially, and then keep track of what agent occupied a given location at a given time and mark it impassable in the A* search.\nThis kind of change involved a small amount of code but a lot of thinking on my part on how to structure it.\nOpus 4.5 attempted a longer change to solve the problem, but was unsuccessful(\\~$7 lost).\n\nInterestingly, after writing my solution, I used GLM 4.7 to fix a small edge case regardling differing path lengths, and made that change correctly.\n\nWhile the agents struggled in solving the pathing problems, they were successful elsewhere in the codebase in expanding the terrain generation.\nOriginally, the obstacles were placed uniformly randomly in the environment.\nTo have a more realistic terrain, I wanted mountain and hill formations of varying heights, easing from high to low.\nIn this effort, I was able to get GLM 4.7 to generate a procedural map generator that used perlin noise to create a graduated height map, and then bezier curves to create mountain ranges.\nThis is one of the sections of code that I almost exclusively use AI generation for, given that the results don't need to be perfect, and for me to solve the problem would be mostly searching up existing solutions.\n\nThis project is still under development, but current progress of all these efforts is shown below.\nGoing forward, I am mostly writing this code by hand, but I will use AI to scaffold out certain kinds of architecture and generate configurations and maps like the terrain.\n<!-- gif of final progress-->\n\n### Compile-time Metaprogamming\n\nAs a last cheeky throw-in, I was trying to build the partial application of functions feature using zig comptime.\nThis was not something nessecary, but a nice feature I like languages, so I was seeing if I could write it for my existing project.\n\nMe specific requirements were quite strict, I wanted to be able to pass in a function f(a,b,c,d) into the partial(.{v_a,v_b}, f) and get a function pointer out that only took c,d as parameters with the other two applied.\nZig is a compiled language without garbage collection or first-class functions, so all of this needs to occur at compile time.\n\nMost AI search tools told me this wasn't possible, and indeed when I forced them to create outputs they weren't good.\nI ended up fiddling with comptime programming a little more myself, and writing a solution.\nDue to some changes in zig .15, the construction of this is harder than it used to be, requiring some hard coding of arity with a switch.\n\n```zig\n// my solution\nfn concatTuples(a: anytype, b: anytype) concatType(@TypeOf(a), @TypeOf(b)) {\n    const T1 = @TypeOf(a);\n    const T2 = @TypeOf(b);\n    const len1 = @typeInfo(T1).@\"struct\".fields.len;\n    const len2 = @typeInfo(T2).@\"struct\".fields.len;\n    var result: concatType(T1, T2) = undefined;\n    inline for (0..len1) |i| result[i] = a[i];\n    inline for (0..len2) |i| result[i + len1] = b[i];\n    return result;\n}\n\nfn concatType(comptime T1: type, comptime T2: type) type {\n    const fields1 = @typeInfo(T1).@\"struct\".fields;\n    const fields2 = @typeInfo(T2).@\"struct\".fields;\n    var types: [fields1.len + fields2.len]type = undefined;\n    inline for (fields1, 0..) |f, i| types[i] = f.type;\n    inline for (fields2, 0..) |f, i| types[i + fields1.len] = f.type;\n    return std.meta.Tuple(&types);\n}\n\nfn makeFunc(comptime T: type, comptime f: anytype, provided: anytype) T {\n    const info = @typeInfo(T);\n    const Fn = info.@\"fn\";\n    const params = Fn.params;\n    return switch (params.len) {\n        0 => struct {\n            fn wrapper() Fn.return_type.? {\n                return @call(.auto, f, provided);\n            }\n        }.wrapper,\n        1 => struct {\n            fn wrapper(a: params[0].type.?) Fn.return_type.? {\n                const in = concatTuples(provided, .{a});\n                return @call(.auto, f, in);\n            }\n        }.wrapper,\n        // ...\n    }\n}\n\nfn partialType(comptime args: type, comptime f: type) type {\n    const args_info = @typeInfo(args);\n    var f_info = @typeInfo(f);\n    const original_arg_types = f_info.@\"fn\".params;\n    f_info.@\"fn\".params = original_arg_types[args_info.@\"struct\".fields.len..];\n    return @Type(f_info);\n}\n\npub fn partial(args: anytype, comptime f: anytype) partialType(@TypeOf(args), @TypeOf(f)) {\n    const out_t = partialType(@TypeOf(args), @TypeOf(f));\n    return makeFunc(out_t, f, args);\n}\n```\n\nBut I had forgotten to test forcing opus 4.5 to do it.\nI don't know if because I solved the problem I knew how to prompt it in the right ways or if I hadn't sanitized my environment properly, but upon a second attempt, opus 4.5 solved my problem for $1.47 in short order, with a solution in the same fashion as mine, but (surprisingly) more condensed.\n\n```zig\n// opus 4.5\nfn PartialFn(comptime F: type, comptime n: usize) type {\n    const info = @typeInfo(F).@\"fn\";\n    var new_params: [info.params.len - n]std.builtin.Type.Fn.Param = undefined;\n    for (info.params[n..], 0..) |p, i| {\n        new_params[i] = p;\n    }\n    return @Type(.{ .@\"fn\" = .{\n        .calling_convention = info.calling_convention,\n        .is_generic = false,\n        .is_var_args = info.is_var_args,\n        .return_type = info.return_type,\n        .params = &new_params,\n    } });\n}\n\npub fn partial(comptime f: anytype, comptime bound_args: anytype) PartialFn(@TypeOf(f), bound_args.len) {\n    const F = @TypeOf(f);\n    const info = @typeInfo(F).@\"fn\";\n    const bound_count = bound_args.len;\n    const remaining_count = info.params.len - bound_count;\n    const p = info.params;\n    const Impl = struct {\n        inline fn callWithArgs(remaining_tuple: std.meta.ArgsTuple(PartialFn(F, bound_count))) info.return_type.? {\n            var full_args: std.meta.ArgsTuple(F) = undefined;\n            inline for (0..bound_count) |i| {\n                full_args[i] = bound_args[i];\n            }\n            inline for (0..remaining_count) |i| {\n                full_args[bound_count + i] = remaining_tuple[i];\n            }\n            return @call(.auto, f, full_args);\n        }\n    };\n    return switch (remaining_count) {\n        0 => struct {\n            fn call() info.return_type.? {\n                return Impl.callWithArgs(.{});\n            }\n        }.call,\n        1 => struct {\n            fn call(a0: p[bound_count].type.?) info.return_type.? {\n                return Impl.callWithArgs(.{a0});\n            }\n        }.call,\n        //...\n    }\n}\n```\n\nThis likely seems like a minor deal to most people, but I am impressed that a coding agent could figure out a niche feature in a less popular language and produce working code for an uncommon task.\nZig recently pushed breaking changes to this kind of code in their recent release(0.15), and the agent was able to navigate that in context, even though such things were not in training data.\n\n<!-- broader takeaways-->\n<!-- 1. **An experienced developer is still needed** to use these tools most effectively, pointing them in the correct direction and evaluating their decisions within a problem domain. -->\n<!-- 2. I found **agent speed and difficulty expressing the full nature of the problem to be my limiting factor** in use. Given enough time, I could often force the agent to solve most easy-medium difficulty problems. On harder problems, I usually gave up and did it myself. -->\n<!-- 3. **Acceptance criteria varies by problem domain**, and AI output code is often bloated. In some use cases like frontend, this is less of an issue, in others like performance-intensive code, each line matters. -->\n<!-- 4. **Intelligence in models matters.** The difference between Opus 4.5 and other alternatives is significant, and can minimize overall iterations needed as well as enable. Agentic IDEs have become good enough that the ball is back in the court of the model development. -->\n<!---->\n## Broader Observations\n\n### Vibe Waiting and Time Management\nPersonally, I have always favored faster non-reasoning llms for searching tasks, things like Gemini Flash, GPT 5.x Instant, Kimi K2 0905, etc.\nThis is because of the classic \"code is compiling\" problem, if I have to wait for long enough, I get distracted from the project and lose a lot of productivity from the flow break(checking phone, etc.).\nThese tools take this problem to the extreme, because once you set them running, they take awhile to give a result.\nThe natural thing to do is to start the tool, get distracted and do something unproductive, and only come back when the tool is done. \nI call this phenomena \"Vibe Waiting\", and I think it is something to be avoided, even if you are the most bullish AI user.\nIf you are using AI as part of your workflow, I believe you must not let waiting on an LLM be a blocking task, otherwise most of the productivity gains are lost.\nThere are many useful things you can do while an agent is running in the background. \nYou could queue up other agents and hop between managing them, you could focus on a part of the codebase the AI can't do as well, or you could do research or review other parts of the code base.\nThis aspect is why people liken coding agents to managing a team or playing an RTS game, the core idea is to keep yourself unblocked as much as possible and manage your time effectively.\nThe creator of claude code [recently shared](https://x.com/bcherny/status/2007179832300581177) that he will often have 6 coding agents running in parallel, and then turn on desktop notifications for when each of them need his feedback.\nSuch time management/multitasking I view as critically important if you want to take advantage of these agents, otherwise they will actively waste your time and teach you to turn off your brain.\n\n### Connection to Code\nOn the topic of turning off your brain, I view the biggest problem of AI code generation is it encourages you to rely on code you don't read or understand.\nThere are a various detrimental effects of not being connected to the codebase that are unique in agent vs traditional coding.\nOne is that is the agent is not able to solve your problem, it is often worse to debug code that you didn't write, and you may be gatekept from your own code by neding to ask the agent for clarification.\nThis is why I believe developers with familiarity in the subject matter, as well as simpler languages/tools, substantially improve the agentic coding experience, because of the ability for the human to read and edit the code.\nAnother issue is a level of understanding of the actual capabilities of the code created.\nPassing tests can help with this problem, but most software has various edge cases and limitations to what it can do, that may or may not have been fully encoded within the specification, or fully reported by the agent.\nYou may not know how generalizable or special cased some pieces of software are, let alone anything about performance characteristics, flexibility to change pieces, etc.\nAs you try to judge the decisions the agents make going forward(such as discussions in planning mode), and direct them to solve unsolved problems, your innate understanding of what those are, of what can or could go wrong, is imperative in shaping how the project is designed.\nIn this stage where these agents still rely on human direction, poor technical understanding of how your system works will lead to poor decisions about how to change it going forward.\nIt's the same reason we value leadership with technical understanding in the software field, not just a business background.\n\n### When is AI Good Enough?\nI think the efficacy of AI code is deeply tied to acceptance standards in the particular domain.\nThis is partially due to models being trained on some tasks more than others, but it's also how easy a verification loop can be made, and how tight are efficiency concerns.\nWithin these experiments, in frontend I had very low acceptance standards, if the page renders and it looks good enough, I don't care how it occurred.\nWhen I am writing a pathing engine, I very much do care about efficiency and simplicity in the code, so the model is not as helpful.\nIn my QR code case, there was no scaffolding for an incremental verification loop, so the model had to make big jumps without checking its work, and was not able to efficiently make progress.\nThese differences explain why some people think that software engineering has been solved by AI, and some people think that it's absolutely useless.\nThe reality is somewhere in between, and both may be right.\n\n\n## Going Forward\nAfter this exploration, I primarily intend to use coding agents when I want to make frontend changes or do boilerplate heavy activities that involve more googling than writing code. \nFor any more complex task, I prefer to write the code and do the setup myself.\nMy current headspace treats AI as a customizable blackbox dependency generator of sorts. \nIf I am not willing to import a package I wouldn't read, I am not willing to use AI code to solve the problem.\nExceptions to this are when the changes are of small enough magnitude I can read them, in a clear enough language that I am not concerned about hidden behavior.\n\nI have turned off AI autocomplete for most languages, I find that in the domains where it is useful, I can allow full fledged agentic coding, and if it's not, then it's usually distracting. \nI am not certain I'll keep it this way, perhaps I will turn it on again if I work in more boilerplate heavy environments.\n\nIn order for me to integrate agentic coding into more of my workflows, a core improvement would need to be speed.\nBecause the edits take so long, agents require various amounts of babysitting to be effective, which breaks my workflow and encourages me to get distracted and not give it close scrutiny.\nThese speed changes tie hand in hand with testing, as errors can be caught earlier via rapid iteration and validation of how well the current solution fits the problem.\nThis is how I prefer to use LLMs for search, faster models that give a quick response which I can then steer to the answers I am looking for, rather than trying to put in some prompt/context engineering work ahead of time, and not know whether it would pay off.\nA much more intelligent model that could confidently one-shot any problem and resolve all edge cases would also resolve this concern, but I only see that possible in closed environments with many tests.\n\nI think my use will change in the future, and I am impressed by how much these tools have improved in the last 6 months.\nMy message to foundational model companies is to focus on model speed and consistency over intelligence going forward, this is what I am looking for to be able to more confidently use agents to speed up my development process.\nFailing early would also be a useful feature. \nI discovered the limitations of the models after running them for a certain amount of time, and it would be preferable if the model could gauge it's own ability in some form, before users need to spend high amounts of inference to not solve the problem.\n\nOne problem I think will remain difficult long term is the ability for human's to express the details of their problem to the LLM.\nThere is a lot that a person might have in their mind that is difficult to rapidly communicate with natural languague, and to define it it often most of the work for a person to solve it themselves.\nThis was a recurring difficulty in most of my projects, particularly the game development.","filePath":"src/content/blog/ai-coding.md","digest":"4170da5d1b73c5b5","rendered":{"html":"<h1 id=\"experiments-with-ai-coding\">Experiments with AI Coding</h1>\n<p>AI coding has become substantially better in the last 6 months. I don’t currently use AI coding much in my workflows, beyond auto complete.\nI am starting a job to build <a href=\"https://www.ycombinator.com/companies/idler\">RL environments to improve coding agents</a>, and I wish to get a better understanding of current abilities and limitations of the current technology.</p>\n<p>In this blog post, I evaluate how useful these tools are at solving my problems by trying to unblock various stale side projects. This is not with respect to any benchmark other than my personal real life usage.</p>\n<p>All observations are as of early January 2026.</p>\n<h2 id=\"overall-takeaways\">Overall Takeaways</h2>\n<p>If you don’t want to read a long post, here are my quick takeaways:</p>\n<ol>\n<li><strong>An experienced developer is still needed</strong> to use these tools most effectively, pointing them in the correct direction and evaluating their decisions within a problem domain.</li>\n<li>I found <strong>agent speed and difficulty expressing the full nature of the problem to be my limiting factor</strong> in use. Given enough time, I could often force the agent to solve most easy-medium difficulty problems, especially when a verification loop is accessible to the agent. On harder problems, I usually gave up and did it myself.</li>\n<li><strong>Acceptance criteria varies by problem domain</strong>, and AI output code is often bloated. In some use cases like frontend, this is less of an issue, in others like performance-intensive code, each line matters.</li>\n<li><strong>Intelligence in models matters.</strong> The difference between Opus 4.5 and other alternatives is significant, and can minimize overall iterations needed as well as enable. Agentic IDEs have become good enough that the ball is back in the court of the model development.</li>\n</ol>\n<!-- need to work on this-->\n<h2 id=\"tools-used\">Tools Used</h2>\n<p>Personally, I primarily use neovim+tmux as my editor setup, preferring to be closer to the terminal. A lot of the popular tools(e.g. Cursor) are based on VSCode-style workflows, which often feel inelegant to me. This does not stop me from using these tools, but I don’t find them as useful because I feel an inherent slowdown that contrasts whatever ai benefits I get.</p>\n<p>As such, I am actively looking for terminal-native ai-coding tools and ways to integrate into my existing neovim workflows.</p>\n<h3 id=\"supermavenautocomplete\">SuperMaven(Autocomplete)</h3>\n<p>Supermaven is the autocomplete engine used(and acquired) by Cursor. However, you can still use it in other editors, with a generous free tier.\nIt is the only AI-autocomplete I have tried that is as fast as an LSP, and what I use in neovim.</p>\n<h3 id=\"opencodeagentic\">OpenCode(Agentic)</h3>\n<p><a href=\"https://opencode.ai/\">OpenCode</a> is a cli tool similar to Claude Code, but designed for support of any models on openrouter, and created by neovim users.\nLike many of such tools, it consists of distinct “Plan” and “Build” agents, where you discuss with an agent that looks at the code base, and only once you are satisfied with the plan, you enable the agent to edit code and build it.\nI found this workflow to be an improvement over methods, allowing agents to take full advantage of reasoning abilities.\nHotkeys and UI were relatively nice, I mostly used OpenCode outside of neovim in a separate tmux tab, and then I would run and read the code afterwards to validate the results.</p>\n<p>I found OpenCode to be relatively good at providing the models the tools to access the internet and my codebase, with reasonable permissions.\nMost of the limitations described seem to be limitations of the models themselves, and as such, I did not try any other agentic tools within this testing.</p>\n<h3 id=\"models\">Models</h3>\n<p>Anthropic’s Opus 4.5 is considered to be the gold standard in agentic coding, while being the significantly more expensive. I attempted to use cheaper alternatives when possible, but when they could not solve the problem, I used Opus 4.5.</p>\n<p>OpenCode has their own fine tuned model(similar to Cursor’s Composer) that was available for free, I used this in initial testing and it performed reasonably well for simple tasks.</p>\n<p><a href=\"https://z.ai/blog/glm-4.7\">GLM 4.7</a> was newly released during this project, and I switched to it over OpenCode’s model. This model seemed to be good at understanding what was happening in the codebase, and is quite good at frontend given the relative cost of the model.</p>\n<h2 id=\"tasks-attempted\">Tasks Attempted</h2>\n <!-- end up linking more of these-->\n<h3 id=\"personal-site\">Personal Site</h3>\n<p>I have been meaning to update my personal site for awhile, making the styling cleaner and providing a respectable starting to point to write blog posts and showcase projects.\nI built out a static site using astro, and told the agent to use the reference materials of shadcn as a starting point.\nI found GLM 4.7 and OpenCode’s model to be more than sufficient for this task, allowing me to quickly build out much of the boilerplate that would’ve taken be hours to fiddle with by hand.\nIn particular, higher level edits like theming were convenient to do via natural language.\nMore complex tasks like animations required more rounds of going back and forth with the agent about the particular behavior that was broken.</p>\n<p>I found that in terms of speed, these models took about the same time to modify the codebase, regardless of the desired edit was large or small.\nThis was often due to a large amount of time being taken to read through the html and find the particular best point to modify.\nFor smaller changes, it was often much faster for me to make changes manually.\nBecause astro is a minimal web framework, it was very easy for me to validate and manually edit the HTML/CSS generated by the LLMs.\nThis codebase worked mostly in separate files, so it was easy to queue up multiple agents in parallel to work on different tasks, and then ping pong between feedback.</p>\n<p>I don’t particularly enjoy writing frontend, particularly styling, so I was appreciative that I could focus on the thinking tasks like writing blog posts while the agents fixed styling in the background.</p>\n<p>You are currently looking at the result of such efforts <a href=\"iamr.site\">iamr.site</a>.\nIt is not perfect or flashy, but it is sufficient for <a href=\"./why.md\">my use</a>.</p>\n<h3 id=\"ml-deployment-to-webassembly\">ML Deployment to WebAssembly</h3>\n<p>Seeing success in web development, I decided to try a harder task with more boilerplate.</p>\n<p>For some <a href=\"https://github.com/iamr-gh/ejsay-gptability/blob/main/paper.pdf\">other research</a>, I trained a small transformer model in PyTorch to classify assignments as more or less “GPT-able”, to try to help educators better test students.\nI wanted to deploy this in a way that it could run locally in the browser via WebAssembly.\nWebAssembly toolchains are often a pain to work with, combining code in multiple languages that has to be shipped to the browser in a very particular way.\nThis task is still not intellectually complex, but requires a lot of googling and fiddling with the environment to get everything to build properly.\nThe final approach used involved compiling to the model to the ONNX format and quantizing it, and then loading that model into an ONNX web runtime and Transformers.js.</p>\n<p>These complexities proved too much for the weaker models to handle, OpenCode’s model generated large amounts of files that produced a pretty frontend in the browser, but failed to load the actual model and produce outputs.</p>\n<p>The intelligence boost of Opus 4.5 was able to complete the problem, and it’s solution was much simpler than the previous AI attempts. It identified subtleties the other models did not notice, such as that the model used a pretrained embedding, which could be loaded in from a separate optimized source for more efficiency.\nBecause I had a paper written on the project, the model was able to efficiently understand that context of what this model was doing, and able to pull examples and language from the paper, producing a quality interactive tool.\nLike the weaker models, this page did not work on first attempt.\nHowever, after pasting console error messages back to the agent a couple times, it was able to solve the problem where weaker models get stuck in a loop.</p>\n<p>This process was not cheap. Even in an environment with minimal files and well formed context, this generation cost ~$8 of inference. Given my unfamiliarity, this probably would’ve taken me a couple hours of work, so a reasonable amount of time was saved. I suspect someone familiar with the space could get it done in under half an hour.</p>\n<p>The code produced in this process was well documented, the commit can be viewed <a href=\"https://github.com/iamr-gh/essay-gptability/tree/web_demo_opus/web_demo\">here</a>.\nThe results of this effort can be viewed at <a href=\"iamr.site/gptability\">iamr.site/gptability</a>.</p>\n<figure>\n  <img src=\"/images/blog/ai-coding/gptability.png\" alt=\"GPTability deployment showing the interactive classifier tool\">\n  <figcaption>Interactive transformer model deployment running in browser via WebAssembly</figcaption>\n</figure>\n<h3 id=\"bespoke-qr-code-generator\">Bespoke QR Code Generator</h3>\n<p>I decided to now test the ability to transfer code over from another code base, as well as work in a less common language.\nI previously wrote a (qr code generator from scratch)[<a href=\"https://github.com/iamr-gh/qr\">https://github.com/iamr-gh/qr</a>] in the programming language nim, which compiles to both assembly(through LLVM) and javascript for web deployments.</p>\n<p>The first task for the coding agent was to take the existing webpage and integrate it into my current site, standardizing the styling and linking some navigation.\nThis task wasn’t particularly difficult, the result is deployed at (iamr.site/qr)[iamr.site/qr].</p>\n<figure class=\"image-smaller\">\n  <img src=\"/images/blog/ai-coding/qr.png\" alt=\"QR code generator showing the custom styling\">\n  <figcaption>Custom QR code generator built with Nim, integrated into the site</figcaption>\n</figure>\n<p>The much harder task I gave Opus 4.5 was the extend the existing nim code.\nI implemented the most basic version of the qr code specification, which only supports URLs of 17 characters.\nThe higher versions of the specification are more complicated, combining extensions to the error correcting algorithm as well as spatial reasoning about different formats.\nThis task was admittedly quite difficult, but I was curious if such knowledge was within its training data or if it could look up existing implementations and translate them to another language.</p>\n<!-- image of v1 vs v2 qr codes?-->\n<p>Opus 4.5 was able to end up with nim code that compiled correctly and output a qr code of the correct size that looked reminiscent of the extended specification. However, these qr codes do not pass the test of an external reader.\nAfter prompting the model that it’s code did not work, it introspected further, but without a checker integrated into the loop, it was unable to make progress on the problem.\nThis process cost $13.29 to generate no useful results, and I cut it off at this point.\nFor those curious about the attempt, the changes can be found <a href=\"https://github.com/iamr-gh/qr/commit/d1a873bdd7e2a917010d7a4be50833e2c0e154cc\">here</a>.</p>\n<h3 id=\"game-development\">Game Development</h3>\n<p>With some knowledge of easy and hard tasks for coding agents, I wished to experiment with more medium difficulty tasks to find the exact lines of competence.\nGame development is a space with a lot of space for code to be written, with a rich environment of varying levels of complexity and boiler plate.</p>\n<p>I revisited a project where I was writing a small pathing engine for an RTS game using zig and raylib.\nIn my particular interest, this problem boils down to creating responsive multi agent pathing and control in a 2 or 2.5 dimensional environment.\nI’ll write up a future blog post about the goals and challenges of this project, but think of this as within the algorithms and performance domain.</p>\n<!--boilerplate and default algorithms-->\n<p>This project was in early stages when I started consisting of just a rendered grid and mouse selection.\nGLM 4.7 was able to bring this up to interactive single agent pathing in an environment with obstacles.\nThis was within the realm of common boilerplate, but still impressive that it output an implementation of A* within zig.</p>\n<!-- insert a gif of initial single agent pathing-->\n<p>The next step of this was where the complexity of the project lies, implementing multiagent pathing while trying to minimize collisions.\nThis involves modifying existing algorithms, creating a unique planner for this particular circumstance.\nI again upgraded to Opus 4.5 for this task, and came across a difficulty not previously encountered: explaining the problem and my priorities.\nOpus did spit out a solution that began to address the problem, but it added layers and complexity and solved additional problems in ways not asked for.\nFor this example I’ll explain some specific code, particularly the diffs between <a href=\"https://github.com/iamr-gh/rts-engine/compare/1d430cf0b9a6665170709a4ebaacb8df19b0e012...e866330d0e04f09e80068117daf5af8f5b7e87ef\">Opus’s implementation</a>\nand <a href=\"https://github.com/iamr-gh/rts-engine/compare/1d430cf0b9a6665170709a4ebaacb8df19b0e012...a1c8a0a94688ccb07dbeac3dfdaec8c45db65077\">my own implementation</a>\nafterwards.</p>\n<p>The specifics of this task was to 1) allow the selection of multiple agents and then 2) pick a set of goals for them based around the clicked point.\nBecause the paths needed to not collide, more than one location needed to be picked around the goal.\nAt this point, the task was only to pick the goals, not to force the pathing algorithm to avoid overlapping individual agent paths.\nI went back and forth with the agent for some time in planning to explain this situation, as well as emphasize symplicity as a virtue when picking between multiple approaches.\nTo me, the solution to this problem would be a simple BFS around the target point, and then assigning agents arbitrarily to the points.</p>\n<figure data-rehype-pretty-code-figure=\"\"><pre style=\"background-color:#24292e;color:#e1e4e8\" tabindex=\"0\" data-language=\"zig\" data-theme=\"github-dark\"><code data-language=\"zig\" data-theme=\"github-dark\"><span data-line=\"\"><span style=\"color:#6A737D\">// my solution</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">pub</span><span style=\"color:#F97583\"> fn</span><span style=\"color:#B392F0\"> getGroupGoals</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">obstacles</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#F97583\">*</span><span style=\"color:#FFAB70\">ObstacleGrid</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">goal</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#FFAB70\">ScreenPos</span><span style=\"color:#E1E4E8\">, ...) </span><span style=\"color:#F97583\">!</span><span style=\"color:#FFAB70\">std</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">ArrayList</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">ScreenPos</span><span style=\"color:#E1E4E8\">) {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    var</span><span style=\"color:#FFAB70\"> goals</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> std</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">ArrayList</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">ScreenPos</span><span style=\"color:#E1E4E8\">).</span><span style=\"color:#FFAB70\">empty</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\"> ">(</span><span style=\"color:#FFAB70\">goal</span><span style=\"color:#E1E4E8\">, {});</span></span>\n<span data-line=\"\"></span>\n<span data-line=\"\"><span style=\"color:#6A737D\">    // bfs</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    while</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#FFAB70\">goals</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">items</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">len</span><span style=\"color:#F97583\"> &#x3C;</span><span style=\"color:#FFAB70\"> count</span><span style=\"color:#E1E4E8\">) {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">        const</span><span style=\"color:#FFAB70\"> curr</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> toVisit</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">dequeue</span><span style=\"color:#E1E4E8\">().</span><span style=\"color:#F97583\">?</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">        if</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#FFAB70\">obstacles</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">obstacles</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">get</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">map</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">screenToGridCoord</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">curr</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">gridSize</span><span style=\"color:#E1E4E8\">))) </span><span style=\"color:#F97583\">|</span><span style=\"color:#FFAB70\">height</span><span style=\"color:#F97583\">|</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            if</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#FFAB70\">height</span><span style=\"color:#F97583\"> >=</span><span style=\"color:#79B8FF\"> 3</span><span style=\"color:#E1E4E8\">) {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                continue</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">        }</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">        try</span><span style=\"color:#FFAB70\"> goals</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">append</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">allocator</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">curr</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">        for</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#FFAB70\">crossDiagonalMovement</span><span style=\"color:#E1E4E8\">) </span><span style=\"color:#F97583\">|</span><span style=\"color:#FFAB70\">move</span><span style=\"color:#F97583\">|</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            const</span><span style=\"color:#FFAB70\"> movedPoint</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#FFAB70\">ScreenPos</span><span style=\"color:#F97583\"> =</span><span style=\"color:#E1E4E8\"> .{ .</span><span style=\"color:#FFAB70\">x</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> curr</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">x</span><span style=\"color:#F97583\"> +</span><span style=\"color:#FFAB70\"> move</span><span style=\"color:#E1E4E8\">[</span><span style=\"color:#79B8FF\">0</span><span style=\"color:#E1E4E8\">] </span><span style=\"color:#F97583\">*</span><span style=\"color:#FFAB70\"> gridSize</span><span style=\"color:#E1E4E8\">, .</span><span style=\"color:#FFAB70\">y</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> curr</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">y</span><span style=\"color:#F97583\"> +</span><span style=\"color:#FFAB70\"> move</span><span style=\"color:#E1E4E8\">[</span><span style=\"color:#79B8FF\">1</span><span style=\"color:#E1E4E8\">] </span><span style=\"color:#F97583\">*</span><span style=\"color:#FFAB70\"> gridSize</span><span style=\"color:#E1E4E8\"> };</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            if</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#FFAB70\">taken</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">get</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">movedPoint</span><span style=\"color:#E1E4E8\">)) </span><span style=\"color:#F97583\">|</span><span style=\"color:#FFAB70\">_</span><span style=\"color:#F97583\">|</span><span style=\"color:#E1E4E8\"> {} </span><span style=\"color:#F97583\">else</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                try</span><span style=\"color:#FFAB70\"> taken</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">put</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">movedPoint</span><span style=\"color:#E1E4E8\">, {});</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                try</span><span style=\"color:#FFAB70\"> toVisit</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">enqueue</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">movedPoint</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">        }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">    }</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    return</span><span style=\"color:#FFAB70\"> goals</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">}</span></span></code></pre></figure>\n<p>Opus 4.5 implemented a much more complex algorithm, using a modified BFS with a range, calculating a centroid of the agents, and then placing them within a target region based on their offset from the centroid.\nThis algorithm does solve other problems not asked, however it is also 4-5x longer than my intended solution, and introduces far more edge cases and interactions.\nI’ve added an (abridged) version of the code below just to convey how much more additional complexity this adds.\nThere are also small bugs that went unannotated in the code, such as claiming the traversal was a BFS while using a datastructure that would yield a DFS.</p>\n<figure data-rehype-pretty-code-figure=\"\"><pre style=\"background-color:#24292e;color:#e1e4e8\" tabindex=\"0\" data-language=\"zig\" data-theme=\"github-dark\"><code data-language=\"zig\" data-theme=\"github-dark\"><span data-line=\"\"><span style=\"color:#6A737D\">// agent solution(some parts omitted)</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">fn</span><span style=\"color:#B392F0\"> gatherAvailableCells</span><span style=\"color:#E1E4E8\">(</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">    targetPos</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#FFAB70\">ScreenPos</span><span style=\"color:#E1E4E8\">,</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">    count</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#F97583\">usize</span><span style=\"color:#E1E4E8\">,</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">    gridSize</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#F97583\">i32</span><span style=\"color:#E1E4E8\">,</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">    obstacleGrid</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#F97583\">*const</span><span style=\"color:#FFAB70\"> ObstacleGrid</span><span style=\"color:#E1E4E8\">,</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">    maxSearchRadius</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#F97583\">i32</span><span style=\"color:#E1E4E8\">,</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">    allocator</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#FFAB70\">std</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">mem</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">Allocator</span><span style=\"color:#E1E4E8\">,</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">) </span><span style=\"color:#F97583\">!</span><span style=\"color:#FFAB70\">std</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">ArrayList</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">ScreenPos</span><span style=\"color:#E1E4E8\">) {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    var</span><span style=\"color:#FFAB70\"> result</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> std</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">ArrayList</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">ScreenPos</span><span style=\"color:#E1E4E8\">).</span><span style=\"color:#FFAB70\">empty</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    errdefer</span><span style=\"color:#FFAB70\"> result</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">deinit</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">allocator</span><spa   // (center-most agents will claim it due to their low scores)</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">                score</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> std</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">math</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">pi</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            } </span><span style=\"color:#F97583\">else</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                const</span><span style=\"color:#FFAB70\"> cellAngle</span><span style=\"color:#F97583\"> =</span><span style=\"color:#B392F0\"> computeAngle</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">cellDx</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">cellDy</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                const</span><span style=\"color:#FFAB70\"> angularDiff</span><span style=\"color:#F97583\"> =</span><span style=\"color:#B392F0\"> angleDifference</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">agentAngle</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">cellAngle</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#6A737D\">                // Distance from target as tie-breaker (normalized)</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                const</span><span style=\"color:#FFAB70\"> dist</span><span style=\"color:#F97583\"> =</span><span style=\"color:#79B8FF\"> @as</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#F97583\">f32</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#79B8FF\">@floatFromInt</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#79B8FF\">@abs</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">cellDx</span><span style=\"color:#E1E4E8\">) </span><span style=\"color:#F97583\">+</span><span style=\"color:#79B8FF\"> @abs</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">cellDy</span><span style=\"color:#E1E4E8\">)));</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">                const</span><span style=\"color:#FFAB70\"> distPenalty</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> dist</span><span style=\"color:#F97583\"> /</span><span style=\"color:#79B8FF\"> @as</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#F97583\">f32</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#79B8FF\">@floatFromInt</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">gridSize</span><span style=\"color:#F97583\"> *</span><span style=\"color:#79B8FF\"> 100</span><span style=\"color:#E1E4E8\">));</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">                score</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> angularDiff</span><span style=\"color:#F97583\"> +</span><span style=\"color:#FFAB70\"> distPenalty</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            }</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            if</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#FFAB70\">score</span><span style=\"color:#F97583\"> &#x3C;</span><span style=\"color:#FFAB70\"> bestScore</span><span style=\"color:#E1E4E8\">) {</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">                bestScore</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> score</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#FFAB70\">                bestCell</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> cell</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">            }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">        }</span></span>\n<span data-line=\"\"><span style=\"color:#6A737D\">        // Assign cell (or fallback to agent's current position)</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">        if</span><span style=\"color:#E1E4E8\"> (</span><span style=\"color:#FFAB70\">bestCell</span><span style=\"color:#E1E4E8\">) </span><span style=\"color:#F97583\">|</span><span style=\"color:#FFAB70\">cell</span><span style=\"color:#F97583\">|</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            try</span><span style=\"color:#FFAB70\"> assignedCells</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">put</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">cell</span><span style=\"color:#E1E4E8\">, {});</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            try</span><span style=\"color:#FFAB70\"> result</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">append</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">allocator</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">cell</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">        } </span><span style=\"color:#F97583\">else</span><span style=\"color:#E1E4E8\"> {</span></span>\n<span data-line=\"\"><span style=\"color:#6A737D\">            // Fallback: use agent's current position</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            const</span><span style=\"color:#FFAB70\"> agentSquare</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> grid</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">getSquareInGrid</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">gridSize</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">agent</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">pos</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            const</span><span style=\"color:#FFAB70\"> agentCenter</span><span style=\"color:#F97583\"> =</span><span style=\"color:#FFAB70\"> grid</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">getSquareCenter</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">gridSize</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">agentSquare</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">            try</span><span style=\"color:#FFAB70\"> result</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#B392F0\">append</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">allocator</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">agentCenter</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">        }</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">    }</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    return</span><span style=\"color:#FFAB70\"> result</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#E1E4E8\">}</span></span></code></pre></figure>\n<!-- maybe add a comparison here-->\n<p>I think this example highlights the exact challenges of using AI code within this domain.\nThe solution does work, and if you didn’t look at the code, you might consider it sufficient.\nHowever, this is the simplest piece of what is going to be a multipart pipeline of pathing, and it has added a large amount of complexity and unknown edge cases, while also being foreign for me to read.</p>\n<p>The next change needed was to modify the A* algorithm to prevent the paths generated from colliding with each other, now that each agent was going to separate locations.\nMy solution involved a ~30 line modification to compute each agent’s path sequentially, and then keep track of what agent occupied a given location at a given time and mark it impassable in the A* search.\nThis kind of change involved a small amount of code but a lot of thinking on my part on how to structure it.\nOpus 4.5 attempted a longer change to solve the problem, but was unsuccessful(~$7 lost).</p>\n<p>Interestingly, after writing my solution, I used GLM 4.7 to fix a small edge case regardling differing path lengths, and made that change correctly.</p>\n<p>While the agents struggled in solving the pathing problems, they were successful elsewhere in the codebase in expanding the terrain generation.\nOriginally, the obstacles were placed uniformly randomly in the environment.\nTo have a more realistic terrain, I wanted mountain and hill formations of varying heights, easing from high to low.\nIn this effort, I was able to get GLM 4.7 to generate a procedural map generator that used perlin noise to create a graduated height map, and then bezier curves to create mountain ranges.\nThis is one of the sections of code that I almost exclusively use AI generation for, given that the results don’t need to be perfect, and for me to solve the problem would be mostly searching up existing solutions.</p>\n<p>This project is still under development, but current progress of all these efforts is shown below.\nGoing forward, I am mostly writing this code by hand, but I will use AI to scaffold out certain kinds of architecture and generate configurations and maps like the terrain.</p>\n<!-- gif of final progress-->\n<h3 id=\"compile-time-metaprogamming\">Compile-time Metaprogamming</h3>\n<p>As a last cheeky throw-in, I was trying to build the partial application of functions feature using zig comptime.\nThis was not something nessecary, but a nice feature I like languages, so I was seeing if I could write it for my existing project.</p>\n<p>Me specific requirements were quite strict, I wanted to be able to pass in a function f(a,b,c,d) into the partial(.{v_a,v_b}, f) and get a function pointer out that only took c,d as parameters with the other two applied.\nZig is a compiled language without garbage collection or first-class functions, so all of this needs to occur at compile time.</p>\n<p>Most AI search tools told me this wasn’t possible, and indeed when I forced them to create outputs they weren’t good.\nI ended up fiddling with comptime programming a little more myself, and writing a solution.\nDue to some changes in zig .15, the construction of this is harder than it used to be, requiring some hard coding of arity with a switch.</p>\n<figure data-rehype-pretty-code-figure=\"\"><pre style=\"background-color:#24292e;color:#e1e4e8\" tabindex=\"0\" data-language=\"zig\" data-theme=\"github-dark\"><code data-language=\"zig\" data-theme=\"github-dark\"><span data-line=\"\"><span style=\"color:#6A737D\">// my solution</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">fn</span><span style=\"color:#B392F0\"> concatTuples</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">a</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#F97583\">anytype</span><span style=\"color:#E1E4E8\">, </span><span style=\"color:#FFAB70\">b</span><span style=\"color:#E1E4E8\">: </span><span style=\"color:#F97583\">anytype</span><span style=\"color:#E1E4E8\">) </span><span style=\"color:#B392F0\">concatType</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#79B8FF\">@TypeOf</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">a</span><span style=\"color:#E1E4E8\">), </span><span style=\"color:#79B8FF\">@TypeOf</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">b</span><span style=\"color:#E1E4E8\">)) {</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    const</span><span style=\"color:#FFAB70\"> T1</span><span style=\"color:#F97583\"> =</span><span style=\"color:#79B8FF\"> @TypeOf</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">a</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    const</span><span style=\"color:#FFAB70\"> T2</span><span style=\"color:#F97583\"> =</span><span style=\"color:#79B8FF\"> @TypeOf</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">b</span><span style=\"color:#E1E4E8\">);</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    const</span><span style=\"color:#FFAB70\"> len1</span><span style=\"color:#F97583\"> =</span><span style=\"color:#79B8FF\"> @typeInfo</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">T1</span><span style=\"color:#E1E4E8\">).</span><span style=\"color:#FFAB70\">@\"struct\"</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">fields</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">len</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    const</span><span style=\"color:#FFAB70\"> len2</span><span style=\"color:#F97583\"> =</span><span style=\"color:#79B8FF\"> @typeInfo</span><span style=\"color:#E1E4E8\">(</span><span style=\"color:#FFAB70\">T2</span><span style=\"color:#E1E4E8\">).</span><span style=\"color:#FFAB70\">@\"struct\"</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">fields</span><span style=\"color:#E1E4E8\">.</span><span style=\"color:#FFAB70\">len</span><span style=\"color:#E1E4E8\">;</span></span>\n<span data-line=\"\"><span style=\"color:#F97583\">    var
